# How to use: copy this file locally into a directory, say `examples`, and run
# Run this config with `nemo-evaluator-launcher run --config-dir examples --config-name local_llama_3_1_8b_instruct`.

# Commented out values show an example of how to override the config values from this file.

# To see the full config, run `nemo-evaluator-launcher run --config-dir examples --config-name local_llama_3_1_8b_instruct --dry-run`

# specify default configs for execution and deployment
defaults:
  - execution: local
  - deployment: none
  - _self_

execution:
  output_dir: oss120_results
  # mode: sequential  # enables sequential execution

target:
  api_endpoint:
    model_id: oss120
    url: http://66.55.67.65/v1/chat/completions
    api_key_name: OPENAI_API_KEY

# specify the benchmarks to evaluate
evaluation:
  nemo_evaluator_config: # global config settings that apply to all tasks
    config:
      params:
        request_timeout: 3600 # timeout for API requests in seconds
        parallelism: 10 # number of parallel requests
    target:
      api_endpoint:
        adapter_config:
          use_reasoning: false # if true, strips reasoning tokens and collects reasoning stats
          use_system_prompt: true # enables custom system prompt
          custom_system_prompt: >-
            "Reasoning: high"
  tasks:
    - name: gpqa_diamond
      nemo_evaluator_config: # task-specific configuration for gpqa_diamond
        config:
          params:
            temperature: 0.6 # sampling temperature
            top_p: 0.95 # nucleus sampling parameter
            max_new_tokens: 8192 # maximum tokens to generate
      env_vars:
         HF_TOKEN: HF_TOKEN # Click request access for GPQA-Diamond: https://huggingface.co/datasets/Idavidrein/gpqa
